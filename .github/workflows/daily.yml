name: daily-radar

on:
  schedule:
    - cron: "0 6 * * *"   # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch: {}    # 支持手动触发测试

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r needs-radar/requirements.txt

      - name: Run radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python needs-radar/radar.py

      - name: Commit seen.db and report back
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add needs-radar/data/seen.db needs-radar/reports/ || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily radar $(date -u +%F)"
          # 跑这 7 分钟里若有人推了代码，先并进来再推
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            # rebase 中 --theirs = 正在重放的本次运行提交，冲突时以它为准（含今天的抓取记录）
            git rebase origin/main || {
              git checkout --theirs needs-radar/data/seen.db
              git add needs-radar/data/seen.db
              GIT_EDITOR=true git rebase --continue
            }
          done
          git push
