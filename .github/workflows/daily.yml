name: daily-radar

on:
  schedule:
    - cron: "0 6 * * *"   # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch: {}    # 支持手动触发测试

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r needs-radar/requirements.txt

      - name: Run radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python needs-radar/radar.py

      - name: Commit seen.db and report back
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add needs-radar/data/seen.db needs-radar/reports/ || true
          git diff --cached --quiet || git commit -m "chore: daily radar $(date -u +%F)"
          git push
